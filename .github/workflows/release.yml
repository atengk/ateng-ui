# ==============================================================================
# 工作流：Changesets 自动化多包锁步发版流水线 (Release Pipeline)
# 适用场景：ateng-ui 核心包与组件库统一聚合发版 (npm + 唯一全局 Tag / GitHub Releases)
# 触发条件：
#   - push: 主干分支 (main) 代码推送
# ==============================================================================

name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Changesets 版本管理与发布
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 安装 Monorepo 依赖
        run: pnpm install --frozen-lockfile

      - name: 产物编译与类型构建
        run: pnpm run build

      - name: 提取当前发版版本号
        id: pkg_version
        run: echo "version=$(node -p "require('./packages/core/package.json').version")" >> $GITHUB_OUTPUT

      - name: 运行 Changesets Action (版本聚合 PR 或发布 npm)
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish --no-git-tag
          version: pnpm changeset version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 创建单一聚合全局 GitHub Release 与 Git Tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION="${{ steps.pkg_version.outputs.version }}"
          TAG_NAME="v$VERSION"
          echo "正在为套件创建全局唯一 Git Tag 与 GitHub Release: $TAG_NAME"
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes \
            --target main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
